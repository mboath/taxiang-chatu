<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧋 奶茶地图</title>
    <script charset="utf-8"
        src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=visualization"
        onerror="handleCDNError()"></script>
    <script>
    function handleCDNError() {
        console.error('腾讯地图 JSAPI 加载失败');
        alert('地图加载失败，请检查网络连接');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Nunito", sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        #map { width: 100%; height: 100%; }

        /* 顶部控制栏 */
        .control-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
            width: 320px;
            max-height: calc(100% - 32px);
            overflow-y: auto;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #2d8659;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 11px;
            color: #8bc4a0;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8f5ee;
        }

        .stat-item { text-align: center; flex: 1; }
        .stat-num { font-size: 20px; font-weight: 700; color: #2d8659; }
        .stat-label { font-size: 10px; color: #8bc4a0; font-weight: 300; }

        /* 品牌选择 */
        .section-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-select {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            background: white;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .brand-select:focus { border-color: #2d8659; }

        .brand-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .chip {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            background: #f5f5f5;
            color: #666;
            transition: all 0.15s;
            white-space: nowrap;
            border: 1px solid transparent;
            user-select: none;
        }

        .chip:hover { background: #e8f5ee; }

        .chip.active {
            background: #2d8659;
            color: white;
            border-color: #1a6640;
        }

        .color-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }

        /* 图例 */
        .legend {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .legend-title { font-size: 11px; color: #999; margin-bottom: 4px; }

        .legend-bar {
            height: 12px;
            border-radius: 6px;
            display: flex;
        }

        .legend-bar > div { flex: 1; }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
            margin-top: 2px;
        }

        /* 底部状态栏 */
        .status-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 8px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            display: none;
        }

        .status-bar .brand-name { color: #2d8659; font-weight: 600; }

        /* 信息面板（点击区域后弹出） */
        .info-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
            width: 280px;
            display: none;
        }

        .info-panel .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #2d8659;
            margin-bottom: 8px;
        }

        .info-panel .panel-close {
            position: absolute;
            top: 12px;
            right: 14px;
            cursor: pointer;
            font-size: 18px;
            color: #ccc;
            line-height: 1;
        }

        .brand-bar-list { margin-top: 8px; }

        .brand-bar-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .brand-bar-name { width: 70px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .brand-bar-track {
            flex: 1;
            height: 14px;
            background: #f5f5f5;
            border-radius: 7px;
            overflow: hidden;
        }

        .brand-bar-fill {
            height: 100%;
            border-radius: 7px;
            transition: width 0.3s;
        }

        .brand-bar-count { width: 28px; text-align: right; color: #888; }

        /* 加载 */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 控制栏 -->
    <div class="control-bar">
        <div class="title">🧋 奶茶地图</div>
        <div class="subtitle">数据来源：腾讯位置服务 WebService API</div>

        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-num" id="shop-count">-</div>
                <div class="stat-label">店铺总数</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="brand-count">-</div>
                <div class="stat-label">品牌数</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="region-count">-</div>
                <div class="stat-label">区域数</div>
            </div>
        </div>

        <div class="section-label">🏷️ 选择品牌</div>
        <select class="brand-select" id="brand-select">
            <option value="__all__">全部品牌（奶茶色系）</option>
        </select>

        <div class="brand-chips" id="brand-chips"></div>

        <div class="legend">
            <div class="legend-title">📊 密度图例</div>
            <div class="legend-bar" id="legend-bar">
                <div style="background: rgba(232,115,74,0.15)"></div>
                <div style="background: rgba(232,115,74,0.3)"></div>
                <div style="background: rgba(232,115,74,0.5)"></div>
                <div style="background: rgba(232,115,74,0.7)"></div>
                <div style="background: rgba(232,115,74,0.9)"></div>
            </div>
            <div class="legend-labels">
                <span>少</span>
                <span>多</span>
            </div>
        </div>
    </div>

    <!-- 信息面板 -->
    <div class="info-panel" id="info-panel">
        <span class="panel-close" onclick="closeInfoPanel()">✕</span>
        <div class="panel-title" id="panel-title">区域统计</div>
        <div id="panel-content"></div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="status-bar">
        当前：<span class="brand-name" id="current-brand">全部品牌</span> · <span id="current-count">0</span> 家门店
    </div>

    <!-- 加载 -->
    <div class="loading" id="loading">加载数据中...</div>

    <script>
        // ========== 全局变量 ==========
        var map = null;
        var areaLayer = null;
        var areaData = null;
        var currentBrand = '__all__';

        // 默认奶茶色系（清新绿）
        var MILKTEA_COLOR = {
            hex: '#2D8659',
            rgba_015: 'rgba(45,134,89,0.15)',
            rgba_03: 'rgba(45,134,89,0.3)',
            rgba_05: 'rgba(45,134,89,0.5)',
            rgba_07: 'rgba(45,134,89,0.7)',
            rgba_09: 'rgba(45,134,89,0.9)',
        };

        // ========== 初始化 ==========
        window.onload = function() {
            initMap();
            loadData();
        };

        function initMap() {
            var center = new TMap.LatLng(30.592849, 114.305596);

            map = new TMap.Map("map", {
                zoom: 10,
                center: center,
                // 玉露：绿色系清新风格
                mapStyleId: "style3",
                baseMap: {
                    type: "vector",
                    // 只显示底图要素（行政区划+地名），不显示路网细节和 3D 建筑
                    features: ["base", "point"],
                },
            });
            console.log("✅ 地图初始化完成（玉露清新风格）");
        }

        function loadData() {
            showLoading(true);
            fetch('data/milktea_area.json')
                .then(function(resp) {
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    return resp.json();
                })
                .then(function(data) {
                    areaData = data;
                    console.log("✅ 数据加载:", areaData.meta);
                    updateStats();
                    populateBrandSelector();
                    renderAreaMap('__all__');
                    showLoading(false);
                    showStatusBar();
                })
                .catch(function(err) {
                    showLoading(false);
                    console.error("❌ 数据加载失败:", err);
                    alert("数据加载失败: " + err.message + "\n请先运行采集脚本");
                });
        }

        // ========== 统计 ==========
        function updateStats() {
            document.getElementById('shop-count').textContent = areaData.meta.total_shops;
            document.getElementById('brand-count').textContent = areaData.meta.total_brands;
            document.getElementById('region-count').textContent = areaData.meta.district_count;
        }

        function populateBrandSelector() {
            var select = document.getElementById('brand-select');
            var chips = document.getElementById('brand-chips');

            select.innerHTML = '<option value="__all__">全部品牌（奶茶色系）</option>';

            var brandList = areaData.brand_list;
            brandList.forEach(function(item) {
                var opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.name + ' (' + item.count + '家)';
                select.appendChild(opt);
            });

            // Chips: Top 10
            var topBrands = brandList.slice(0, 10);
            chips.innerHTML = '';
            topBrands.forEach(function(item) {
                var colors = areaData.brand_colors[item.name];
                var colorDot = colors ? '<span class="color-dot" style="background:' + colors.hex + '"></span>' : '';
                var chip = document.createElement('span');
                chip.className = 'chip';
                chip.innerHTML = colorDot + item.name;
                chip.dataset.brand = item.name;
                chip.onclick = function() {
                    selectBrand(item.name);
                };
                chips.appendChild(chip);
            });
        }

        // ========== 区域着色 ==========
        function renderAreaMap(brand) {
            currentBrand = brand;

            // 销毁旧图层
            if (areaLayer) {
                areaLayer.remove();
                areaLayer = null;
            }

            // 获取品牌颜色
            var brandColor;
            if (brand === '__all__') {
                brandColor = MILKTEA_COLOR;
            } else {
                brandColor = areaData.brand_colors[brand] || MILKTEA_COLOR;
            }

            // 计算每个区域的数量
            var areas = areaData.areas;
            var counts = areas.map(function(a) {
                if (brand === '__all__') return a.total_shops;
                return a.brand_stats[brand] || 0;
            });

            var maxCount = Math.max.apply(null, counts);
            if (maxCount === 0) maxCount = 1;

            // 构建样式：5 个密度级别
            var styles = {
                s0: { fillColor: 'rgba(0,0,0,0)', strokeColor: '#ddd', strokeWidth: 1 },
                s1: { fillColor: brandColor.rgba_015, strokeColor: brandColor.hex, strokeWidth: 1 },
                s2: { fillColor: brandColor.rgba_03, strokeColor: brandColor.hex, strokeWidth: 1 },
                s3: { fillColor: brandColor.rgba_05, strokeColor: brandColor.hex, strokeWidth: 1 },
                s4: { fillColor: brandColor.rgba_07, strokeColor: brandColor.hex, strokeWidth: 1 },
                s5: { fillColor: brandColor.rgba_09, strokeColor: brandColor.hex, strokeWidth: 1.5 },
            };

            // 构建数据
            var data = [];
            areas.forEach(function(a) {
                var count = brand === '__all__' ? a.total_shops : (a.brand_stats[brand] || 0);
                if (count === 0) return; // 无数据的区域不显示

                var ratio = count / maxCount;
                var styleId;
                if (ratio < 0.1) styleId = 's0';
                else if (ratio < 0.25) styleId = 's1';
                else if (ratio < 0.5) styleId = 's2';
                else if (ratio < 0.75) styleId = 's3';
                else if (ratio < 0.9) styleId = 's4';
                else styleId = 's5';

                // path 可能是多部分（如飞地），Area API 支持一维和多维
                var paths = a.path;
                if (paths.length === 1) {
                    // 单个多边形：一维数组
                    data.push({
                        path: paths[0],
                        styleId: styleId,
                        properties: {
                            name: a.name,
                            count: count,
                            brand_stats: a.brand_stats,
                            total_shops: a.total_shops,
                        }
                    });
                } else {
                    // 多部分：每个部分单独一个面
                    paths.forEach(function(p) {
                        data.push({
                            path: p,
                            styleId: styleId,
                            properties: {
                                name: a.name,
                                count: count,
                                brand_stats: a.brand_stats,
                                total_shops: a.total_shops,
                            }
                        });
                    });
                }
            });

            console.log("📊 区域着色:", brand, data.length, "个面,", "max:", maxCount);

            // 创建 Area 图层
            areaLayer = new TMap.visualization.Area({
                styles: styles,
                selectOptions: {
                    action: 'hover',
                    style: {
                        fillColor: 'rgba(255,255,255,0.4)',
                        strokeColor: '#2d8659',
                        strokeWidth: 2,
                    }
                },
                minZoom: 3,
                maxZoom: 16,
            }).setData(data).addTo(map);

            // 点击事件
            areaLayer.on('click', function(evt) {
                var result = evt.detail;
                if (result && result.properties) {
                    showInfoPanel(result.properties, result.geometry);
                }
            });

            // 更新图例颜色
            updateLegend(brandColor);

            // 更新状态栏
            var totalCount = counts.reduce(function(a, b) { return a + b; }, 0);
            document.getElementById('current-brand').textContent =
                brand === '__all__' ? '全部品牌' : brand;
            document.getElementById('current-count').textContent = totalCount;

            // 更新 chips 选中
            document.querySelectorAll('.chip').forEach(function(c) {
                c.classList.toggle('active', c.dataset.brand === brand);
            });
            document.getElementById('brand-select').value = brand;
        }

        function selectBrand(brand) {
            renderAreaMap(brand);
        }

        document.getElementById('brand-select').addEventListener('change', function(e) {
            selectBrand(e.target.value);
        });

        // ========== 图例更新 ==========
        function updateLegend(color) {
            var bar = document.getElementById('legend-bar');
            bar.innerHTML =
                '<div style="background:' + color.rgba_015 + '"></div>' +
                '<div style="background:' + color.rgba_03 + '"></div>' +
                '<div style="background:' + color.rgba_05 + '"></div>' +
                '<div style="background:' + color.rgba_07 + '"></div>' +
                '<div style="background:' + color.rgba_09 + '"></div>';
        }

        // ========== 信息面板 ==========
        function showInfoPanel(props, geometry) {
            var panel = document.getElementById('info-panel');
            var title = document.getElementById('panel-title');
            var content = document.getElementById('panel-content');

            title.textContent = '🧋 ' + props.name;

            var total = props.total_shops;
            var brandCount = currentBrand === '__all__' ? total : (props.brand_stats[currentBrand] || 0);

            var html = '<div style="font-size:13px;color:#888;margin-bottom:8px;">';
            html += '总店铺: <b style="color:#2d8659;">' + total + '</b> 家';
            if (currentBrand !== '__all__') {
                html += '　当前品牌: <b style="color:#2d8659;">' + brandCount + '</b> 家';
            }
            html += '</div>';

            // Top 5 品牌条形图
            var stats = props.brand_stats;
            var sorted = Object.keys(stats).map(function(k) { return {name: k, count: stats[k]}; });
            sorted.sort(function(a, b) { return b.count - a.count; });
            var top5 = sorted.slice(0, 5);
            var maxBrandCount = top5.length > 0 ? top5[0].count : 1;

            html += '<div class="brand-bar-list">';
            top5.forEach(function(item) {
                var colors = areaData.brand_colors[item.name];
                var color = colors ? colors.hex : '#5BA8E8';
                var width = (item.count / maxBrandCount * 100) + '%';
                html += '<div class="brand-bar-item">';
                html += '<span class="color-dot" style="background:' + color + '"></span>';
                html += '<span class="brand-bar-name">' + item.name + '</span>';
                html += '<span class="brand-bar-track"><span class="brand-bar-fill" style="width:' + width + ';background:' + color + '"></span></span>';
                html += '<span class="brand-bar-count">' + item.count + '</span>';
                html += '</div>';
            });
            html += '</div>';

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        function closeInfoPanel() {
            document.getElementById('info-panel').style.display = 'none';
        }

        // ========== 辅助 ==========
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showStatusBar() {
            document.getElementById('status-bar').style.display = 'block';
        }
    </script>
</body>
</html>
